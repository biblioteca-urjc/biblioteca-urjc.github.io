backend:
  name: turbo-github
  turbo_site_id: 1b3787af-b8f4-4875-817d-9a0af637e62c
media_folder: static
public_folder: /
collections:

  - name: 'actualidad'
    label: 'Actualidad'
    folder: 'content/spanish/blog'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    media_folder: '../../../static/blog/{{slug}}'
    public_folder: 'blog/{{slug}}'
    editor:
      preview: true
    fields:
      - { label: 'Título', name: 'title', widget: 'string' }
      - { label: 'Fecha de publicación', name: 'date', widget: 'datetime',default: "{{now}}",  date_format: "YYYY-MM-DD"}
      - { label: 'Descripción', name: 'description', widget: 'string' }
      - { label: 'Categorías', name: 'categories', widget: 'hidden', default: ["Universidad"]}
      - { label: 'Etiquetas', name: 'tags', widget: 'list'}
      - { label: 'Logo', name: 'image', widget: 'image', default: 'logos/logo-ofilibre-2025.jpg'}
      - { label: 'Cuerpo', name: 'body', widget: 'markdown' }

  - name: 'tu-biblioteca'
    label: 'Tu biblioteca'
    folder: 'content/spanish/tu-biblioteca'
    create: true
    slug: '{{slug}}'
    media_folder: '../../../static/tu-biblioteca/{{slug}}'
    public_folder: 'tu-biblioteca/{{slug}}'
    editor:
      preview: true
    fields:
      - { label: 'Título', name: 'title', widget: 'string' }
      - { label: 'Descripción', name: 'description', widget: 'string', required: false }
      - { label: 'Categorías', name: 'categories', widget: 'list', required: false }
      - { label: 'Etiquetas', name: 'tags', widget: 'list', required: false }
      - { label: 'Imagen', name: 'image', widget: 'image', required: false }
      - { label: 'Cuerpo', name: 'body', widget: 'markdown', required: false }

  - name: 'bibliotecas'
    label: 'Bibliotecas de campus'
    folder: 'content/spanish/tu-biblioteca/bibliotecas-de-campus'
    create: true
    slug: '{{slug}}'
    editor:
      preview: true
    fields:
      - { label: 'Título', name: 'title', widget: 'string' }
      - { label: 'Descripción', name: 'description', widget: 'string', required: false }
      - { label: 'Orden', name: 'weight', widget: 'number', value_type: 'int', default: 1 }
      - { label: 'Imagen', name: 'image', widget: 'image', required: false }
      - { label: 'Horario', name: 'hours', widget: 'string', required: false }
      - { label: 'Teléfono', name: 'phone', widget: 'string', required: false }
      - { label: 'Correo electrónico', name: 'email', widget: 'string', required: false }
      - { label: 'Enlace para llegar', name: 'map_url', widget: 'string', required: false }
      - { label: 'Cuerpo', name: 'body', widget: 'markdown', required: false }

  - name: 'normativa'
    label: 'Normativa'
    folder: 'content/spanish/tu-biblioteca/normativa'
    create: true
    slug: '{{slug}}'
    editor:
      preview: true
    fields:
      - { label: 'Título', name: 'title', widget: 'string' }
      - { label: 'Orden', name: 'weight', widget: 'number', value_type: 'int', default: 1 }
      - { label: 'Enlace al documento', name: 'document_url', widget: 'string', required: false }
      - { label: 'Cuerpo', name: 'body', widget: 'markdown', required: false }

  - name: 'formularios'
    label: 'Formularios'
    folder: 'content/spanish/tu-biblioteca/formularios'
    create: true
    slug: '{{slug}}'
    editor:
      preview: true
    fields:
      - { label: 'Título', name: 'title', widget: 'string' }
      - { label: 'Orden', name: 'weight', widget: 'number', value_type: 'int', default: 1 }
      - { label: 'Enlace al formulario', name: 'form_url', widget: 'string', required: false }
      - { label: 'Cuerpo', name: 'body', widget: 'markdown', required: false }

  - name: 'recursos'
    label: 'Recursos'
    folder: 'content/spanish/recursos'
    create: true
    slug: '{{slug}}'
    media_folder: '../../../static/recursos/{{slug}}'
    public_folder: 'recursos/{{slug}}'
    editor:
      preview: true
    fields:
      - { label: 'Título', name: 'title', widget: 'string' }
      - { label: 'URL del buscador', name: 'search', widget: 'string', required: false }
      - { label: 'Descripción', name: 'description', widget: 'string', required: false }
      - { label: 'Categorías', name: 'categories', widget: 'list', required: false }
      - { label: 'Etiquetas', name: 'tags', widget: 'list', required: false }
      - { label: 'Enlace externo', name: 'external_url', widget: 'string', required: false }
      - { label: 'Imagen', name: 'image', widget: 'image', required: false }
      - label: 'Enlaces con imagen'
        name: 'links'
        widget: 'list'
        required: false
        fields:
          - { label: 'Título', name: 'title', widget: 'string' }
          - { label: 'URL', name: 'url', widget: 'string' }
          - { label: 'Imagen', name: 'image', widget: 'image' }
      - { label: 'Cuerpo', name: 'body', widget: 'markdown', required: false }

  - name: 'soy-estudiante'
    label: 'Soy estudiante'
    folder: 'content/spanish/soy-estudiante'
    create: true
    slug: '{{slug}}'
    media_folder: '../../../static/soy-estudiante/{{slug}}'
    public_folder: 'soy-estudiante/{{slug}}'
    editor:
      preview: true
    fields:
      - { label: 'Título', name: 'title', widget: 'string' }
      - { label: 'Descripción', name: 'description', widget: 'string', required: false }
      - { label: 'Categorías', name: 'categories', widget: 'list', required: false }
      - { label: 'Etiquetas', name: 'tags', widget: 'list', required: false }
      - { label: 'Enlace externo', name: 'external_url', widget: 'string', required: false }
      - { label: 'Imagen', name: 'image', widget: 'image', required: false }
      - { label: 'Cuerpo', name: 'body', widget: 'markdown', required: false }

  - name: 'soy-pdi'
    label: 'Soy PDI'
    folder: 'content/spanish/soy-pdi'
    create: true
    slug: '{{slug}}'
    media_folder: '../../../static/soy-pdi/{{slug}}'
    public_folder: 'soy-pdi/{{slug}}'
    editor:
      preview: true
    fields:
      - { label: 'Título', name: 'title', widget: 'string' }
      - { label: 'Descripción', name: 'description', widget: 'string', required: false }
      - { label: 'Categorías', name: 'categories', widget: 'list', required: false }
      - { label: 'Etiquetas', name: 'tags', widget: 'list', required: false }
      - { label: 'Enlace externo', name: 'external_url', widget: 'string', required: false }
      - { label: 'Imagen', name: 'image', widget: 'image', required: false }
      - { label: 'Cuerpo', name: 'body', widget: 'markdown', required: false }
  
  - name: 'avisos'
    label: 'Avisos'
    folder: 'content/spanish/avisos'
    create: true
    slug: '{{slug}}'
    media_folder: '../../../static/avisos/{{slug}}'
    public_folder: 'avisos/{{slug}}'
    editor:
      preview: true
    fields:
      - { label: 'Título', name: 'title', widget: 'string', required: false }
      - { label: 'Fecha', name: 'date', widget: 'datetime', required: false, date_format: 'YYYY-MM-DD' }
      - { label: 'Imagen', name: 'image', widget: 'image', required: false }
      - { label: 'Enlace', name: 'link', widget: 'string', required: false }
      - { label: 'Cuerpo', name: 'body', widget: 'markdown', required: false }
